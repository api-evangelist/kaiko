specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Kaiko
providerId: kaiko
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-07-22'
reconciled: false
tags:
  - Crypto
  - Market Data
  - Rate Limiting
description: >-
  Kaiko documents a standard REST API limit of 6000 requests per API key per minute;
  requests beyond that threshold return HTTP 429. Higher limits and Kaiko Stream
  connection counts are negotiated per enterprise contract (contact support@kaiko.com).
notes: Documented standard REST limit; Stream limits are contract-specific.
sources:
  - https://docs.kaiko.com/rest-api/general/getting-started/rate-limiting.md
responseCodes:
  throttled: 429
limits:
  - name: REST API (standard)
    scope: api_key
    metric: requests_per_minute
    limit: 6000
    notes: Documented standard limit; higher limits negotiable via support@kaiko.com.
  - name: Stream connections (typical)
    scope: api_key
    metric: concurrent_connections
    limit: 5
    notes: Negotiated per contract.
policies:
  - name: Backoff Strategy
    description: Honor 429 Retry-After and apply exponential backoff with jitter.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
