versioning:
  scheme: uri-path
  current: v2
  notes: >-
    REST endpoints are versioned in the URL path (/v1, /v2, some /v3) with per-endpoint
    dataset versions (trades.v1, index.v1, index_reference_data.v1). Dataset versioning is
    orthogonal to API versioning: breaking data corrections mint a new dataset version
    selected via the data_version parameter; Kaiko recommends pinning explicit versions
    in production.
